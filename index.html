<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini Projeto</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container">
      <section class="card">
        <p class="eyebrow"> Tudo sobre javaScript</p>
        <h1>Olá, mundo!</h1>
        <p class="description">
          Este é um exemplo básico de página criada com HTML, CSS e JavaScript.
        </p>

        <div class="controls">
          <button id="toggleTheme" type="button">Tema escuro</button>
          <button id="incrementBtn" class="secondary" type="button">Contador +1</button>
        </div>

        <div class="counter-box">
          <span class="label">Contador</span>
          <strong id="counter">0</strong>
        </div>

        <p id="hour" class="time"></p>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
